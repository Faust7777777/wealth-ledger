name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-tools:
    name: Rust server and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs

      - name: Install Python tooling dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile tools/contract_check.py tools/mock_api_server.py tools/server_smoke.py tools/local_ledger_smoke.py server/dev_server.py

      - name: Run contract checks
        run: python tools/contract_check.py

      - name: Check shell scripts
        run: bash -n tools/install_vps_systemd.sh tools/check_vps_readiness.sh tools/backup_vps_ledger.sh tools/restore_vps_ledger.sh tools/vps_backup_restore_smoke.sh

      - name: Run VPS backup and restore smoke
        run: bash tools/vps_backup_restore_smoke.sh

      - name: Check Rust formatting
        run: cargo fmt --manifest-path server-rs/Cargo.toml --check

      - name: Run Rust tests
        run: cargo test --manifest-path server-rs/Cargo.toml

      - name: Run Rust clippy
        run: cargo clippy --manifest-path server-rs/Cargo.toml -- -D warnings

      - name: Run API smoke checks
        run: python tools/server_smoke.py

      - name: Run local ledger smoke
        run: python tools/local_ledger_smoke.py

      - name: Run production TLS/auth/persistence topology smoke
        run: python tools/production_topology_smoke.py

  flutter-windows:
    name: Flutter Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell parse errors in $($_.FullName):"
              $errors | Format-List | Out-String | Write-Error
            }
          }
          if ($failed) { exit 1 }

      - name: Run local Windows backup and restore smoke
        shell: pwsh
        run: ./tools/local_backup_restore_smoke.ps1

      - name: Run package integrity smoke
        shell: pwsh
        run: ./tools/package_integrity_smoke.ps1

      - name: Analyze Flutter
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Flutter and Rust local-server subscription smoke
        shell: pwsh
        timeout-minutes: 10
        run: ./tools/frontend_local_server_smoke.ps1

      - name: Check paired Windows self-use package readiness
        shell: pwsh
        run: ./tools/package_release.ps1 -WindowsOnly -CheckReadinessOnly

      - name: Check Windows server client readiness
        shell: pwsh
        run: ./tools/package_remote_windows.ps1 -CheckReadinessOnly

      - name: Build paired Windows self-use package
        shell: pwsh
        run: ./tools/package_release.ps1 -WindowsOnly -OutputDir tmp/package-ci

      - name: Build Windows server client package
        shell: pwsh
        run: ./tools/package_remote_windows.ps1 -OutputDir tmp/package-remote-ci

  flutter-android:
    name: Flutter Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=DATA_SOURCE=api_remote --dart-define=API_BASE=
