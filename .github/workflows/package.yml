name: Package

on:
  workflow_dispatch:
    inputs:
      include_android_readonly_preview:
        description: Build the explicitly read-only Android preview (no writable Android data source yet)
        required: false
        default: false
        type: boolean
      remote_api_base:
        description: Optional fixed HTTPS API origin; leave empty for a universal runtime-configured client
        required: false
        default: ''
        type: string
      include_android_server_client:
        description: Build the writable Android server client (debug-signed for private self-use)
        required: false
        default: false
        type: boolean

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows-source:
    name: Verify source before packaging
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install Python tooling dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Check Python syntax
        shell: pwsh
        run: python -m py_compile tools/contract_check.py tools/mock_api_server.py tools/server_smoke.py tools/local_ledger_smoke.py server/dev_server.py

      - name: Check contracts
        shell: pwsh
        run: python tools/contract_check.py

      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path server-rs/Cargo.toml --check

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path server-rs/Cargo.toml

      - name: Run Rust clippy
        shell: pwsh
        run: cargo clippy --manifest-path server-rs/Cargo.toml -- -D warnings

      - name: Run API smoke checks
        shell: pwsh
        run: python tools/server_smoke.py

      - name: Run local ledger smoke
        shell: pwsh
        run: python tools/local_ledger_smoke.py

      - name: Run local Windows backup and restore smoke
        shell: pwsh
        run: ./tools/local_backup_restore_smoke.ps1

      - name: Run package integrity smoke
        shell: pwsh
        run: ./tools/package_integrity_smoke.ps1

      - name: Analyze Flutter
        shell: pwsh
        run: flutter analyze

      - name: Run Flutter tests
        shell: pwsh
        run: flutter test

      - name: Run Flutter and Rust local-server subscription smoke
        shell: pwsh
        timeout-minutes: 10
        run: ./tools/frontend_local_server_smoke.ps1

      - name: Check Windows package readiness
        shell: pwsh
        run: ./tools/package_release.ps1 -WindowsOnly -CheckReadinessOnly

      - name: Check Windows server-client readiness
        shell: pwsh
        run: ./tools/package_remote_windows.ps1 -CheckReadinessOnly

  package-windows:
    name: Package Windows
    needs: verify-windows-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build paired Windows self-use package
        shell: pwsh
        run: ./tools/package_release.ps1 -WindowsOnly -OutputDir dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: finwealth-windows-self-use-x64
          path: |
            dist/*-windows-self-use-x64.zip
            dist/*-windows-self-use-x64.zip.sha256
          if-no-files-found: error

  package-android:
    name: Package Android read-only preview
    needs: verify-windows-source
    if: ${{ inputs.include_android_readonly_preview }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build explicitly read-only preview APK
        shell: pwsh
        run: ./tools/package_release.ps1 -AndroidOnly -AndroidReadOnlyPreview -OutputDir dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: finwealth-android-readonly-preview-debug
          path: |
            dist/*-android-readonly-preview-debug.apk
            dist/*-android-readonly-preview-debug.apk.sha256
          if-no-files-found: error

  package-windows-remote:
    name: Package Windows server client
    needs: verify-windows-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows server client
        shell: pwsh
        env:
          FINWEALTH_REMOTE_API_BASE: ${{ inputs.remote_api_base }}
        run: ./tools/package_remote_windows.ps1 -ApiBase $env:FINWEALTH_REMOTE_API_BASE -OutputDir dist

      - name: Upload Windows server-client artifact
        uses: actions/upload-artifact@v4
        with:
          name: finwealth-windows-server-client-x64
          path: |
            dist/*-windows-server-client-x64.zip
            dist/*-windows-server-client-x64.zip.sha256
          if-no-files-found: error

  package-android-remote:
    name: Package Android server client
    needs: verify-windows-source
    if: ${{ inputs.include_android_server_client }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android server client
        shell: pwsh
        env:
          FINWEALTH_REMOTE_API_BASE: ${{ inputs.remote_api_base }}
        run: ./tools/package_remote_android.ps1 -ApiBase $env:FINWEALTH_REMOTE_API_BASE -OutputDir dist

      - name: Upload Android server-client artifact
        uses: actions/upload-artifact@v4
        with:
          name: finwealth-android-server-client-debug
          path: |
            dist/*-android-server-client-debug.apk
            dist/*-android-server-client-debug.apk.sha256
            dist/*-android-server-client-debug.apk.manifest.json
          if-no-files-found: error
