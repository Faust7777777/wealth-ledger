name: Package

on:
  workflow_dispatch:
    inputs:
      include_android_readonly_preview:
        description: Build the explicitly read-only Android preview (no writable Android data source yet)
        required: false
        default: false
        type: boolean

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build paired Windows self-use package
        shell: pwsh
        run: ./tools/package_release.ps1 -WindowsOnly -OutputDir dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: finwealth-windows-self-use-x64
          path: dist/*-windows-self-use-x64.zip
          if-no-files-found: error

  package-android:
    name: Package Android read-only preview
    if: ${{ inputs.include_android_readonly_preview }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build explicitly read-only preview APK
        shell: pwsh
        run: ./tools/package_release.ps1 -AndroidOnly -AndroidReadOnlyPreview -OutputDir dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: finwealth-android-readonly-preview-debug
          path: dist/*-android-readonly-preview-debug.apk
          if-no-files-found: error
