name: Package

on:
  workflow_dispatch:
    inputs:
      include_android_readonly_preview:
        description: Build the explicitly read-only Android preview (no writable Android data source yet)
        required: false
        default: false
        type: boolean

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows-source:
    name: Verify source before packaging
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check contracts and Python tools
        shell: pwsh
        run: |
          python -m py_compile tools/contract_check.py tools/mock_api_server.py tools/server_smoke.py tools/local_ledger_smoke.py server/dev_server.py
          python tools/contract_check.py

      - name: Check Rust server
        shell: pwsh
        run: |
          cargo fmt --manifest-path server-rs/Cargo.toml --check
          cargo test --manifest-path server-rs/Cargo.toml
          cargo clippy --manifest-path server-rs/Cargo.toml -- -D warnings

      - name: Run server and ledger smoke checks
        shell: pwsh
        run: |
          python tools/server_smoke.py
          python tools/local_ledger_smoke.py
          ./tools/local_backup_restore_smoke.ps1
          ./tools/package_integrity_smoke.ps1

      - name: Check Flutter client
        shell: pwsh
        run: |
          flutter analyze
          flutter test
          ./tools/package_release.ps1 -WindowsOnly -CheckReadinessOnly

  package-windows:
    name: Package Windows
    needs: verify-windows-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build paired Windows self-use package
        shell: pwsh
        run: ./tools/package_release.ps1 -WindowsOnly -OutputDir dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: finwealth-windows-self-use-x64
          path: |
            dist/*-windows-self-use-x64.zip
            dist/*-windows-self-use-x64.zip.sha256
          if-no-files-found: error

  package-android:
    name: Package Android read-only preview
    needs: verify-windows-source
    if: ${{ inputs.include_android_readonly_preview }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build explicitly read-only preview APK
        shell: pwsh
        run: ./tools/package_release.ps1 -AndroidOnly -AndroidReadOnlyPreview -OutputDir dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: finwealth-android-readonly-preview-debug
          path: |
            dist/*-android-readonly-preview-debug.apk
            dist/*-android-readonly-preview-debug.apk.sha256
          if-no-files-found: error
