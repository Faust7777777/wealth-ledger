  /snapshots/latest:
    get:
      tags: [Snapshots]
      summary: Get latest net worth snapshot.
      responses:
        "200":
          description: Latest snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorthSnapshotResponse"

  /snapshots:
    get:
      tags: [Snapshots]
      summary: List snapshots.
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive snapshot date; must be supplied together with to.
          schema:
            $ref: "#/components/schemas/ISODate"
        - name: to
          in: query
          required: false
          description: Inclusive snapshot date; must be supplied together with from.
          schema:
            $ref: "#/components/schemas/ISODate"
      responses:
        "200":
          description: Snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorthSnapshotListResponse"

  /snapshots/manual:
    post:
      tags: [Snapshots]
      summary: Create a manual snapshot.
      parameters:
