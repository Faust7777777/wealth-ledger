    CreateMovementDraftInput:
      type: object
      description: >-
        Current server mode validates accounting semantics by movement type.
        Income/dividend/interest are one in/source cash entry; expense/fee are
        one out/source cash entry; adjustment is one adjustment cash entry.
        Buy/sell use one principal cash leg and one holding quantity leg, with
        optional fee/tax cash outflow legs from the same account and currency.
        Buy cash outflow and cost basis are principal + fee + tax; sell net
        cash inflow is gross proceeds - fee - tax while cost basis decreases
        in proportion to quantity sold. Quote valuation still uses quantity
        times price. Loan
        disbursement/repayment use equal same-currency legs between liability
        and non-liability accounts. Direct correction drafts are rejected; use
        /movements/corrections.
      required: [type, occurredAt, title, entries]
      properties:
        type:
          type: string
          enum:
            - income
            - expense
            - transfer
            - buy
            - sell
            - dividend
            - interest
            - fee
            - adjustment
            - loan_disbursement
            - loan_repayment
            - correction
        occurredAt:
          $ref: "#/components/schemas/ISODateTime"
        title:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MovementEntryInput"
        categoryId:
          $ref: "#/components/schemas/ID"
        counterpartyId:
          $ref: "#/components/schemas/ID"
        amountBreakdown:
          $ref: "#/components/schemas/TransactionAmountBreakdown"
        settlement:
          $ref: "#/components/schemas/SettlementInfo"
        transferMeta:
          $ref: "#/components/schemas/TransferMeta"
    CreateCorrectionInput:
      type: object
      required: [targetMovementId, reason]
      description: >-
        Provide proposedDiffs for the legacy single-entry amount adjustment, or
        replacementEntries for a complete multi-leg replacement. The server
        creates one correction movement containing reversals of every original
        entry followed by the complete replacement entries. The original
        confirmed movement is never modified. Buy/sell corrections require
        replacementEntries and are limited to the latest confirmed trade for the
        affected holding; targets with later trades or missing frozen sale cost
        basis are rejected rather than guessed.
      anyOf:
        - required: [proposedDiffs]
        - required: [replacementEntries]
      properties:
        targetMovementId:
          $ref: "#/components/schemas/ID"
        reason:
          type: string
        proposedDiffs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AiFieldDiff"
        replacementEntries:
          type: array
          minItems: 1
          description: Complete desired entries, not a partial patch.
          items:
            $ref: "#/components/schemas/MovementEntryInput"

