      type: object
      additionalProperties: false
      required:
        - throughDate
        - createdCount
        - alreadyPendingCount
        - blockedCount
        - remainingEligibleCount
        - hasMore
        - created
        - skipped
      properties:
        throughDate:
          $ref: "#/components/schemas/ISODate"
        createdCount:
          type: integer
          minimum: 0
          description: Equal to the length of created.
        alreadyPendingCount:
          type: integer
          minimum: 0
          description: Count of skipped items whose reason is already_pending.
        blockedCount:
          type: integer
          minimum: 0
          description: Count of skipped items whose reason is payment_account_unavailable or payment_currency_unsupported.
        remainingEligibleCount:
          type: integer
          minimum: 0
          description: Otherwise creatable subscriptions left uncreated only because limit was reached.
        hasMore:
          type: boolean
          description: True exactly when remainingEligibleCount is greater than zero.
        created:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionDueScanCreated"
        skipped:
          type: array
          description: Already-pending and payment-blocked candidates in stable scan order.
          items:
            $ref: "#/components/schemas/SubscriptionDueScanSkip"
