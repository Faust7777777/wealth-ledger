    CreateSubscriptionRequest:
      type: object
      required: [displayName, provider, amount, paymentAccountId, billingCycle, startDate]
      description: >-
        duration and endDate are mutually exclusive. paymentAccountId must
        reference a non-archived account whose supportedCurrencies contains
        amount.currency.
      properties:
        displayName:
          type: string
        provider:
          type: string
        planName:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        paymentAccountId:
          $ref: "#/components/schemas/ID"
        billingCycle:
          $ref: "#/components/schemas/SubscriptionBillingCycle"
        startDate:
          $ref: "#/components/schemas/ISODate"
        duration:
          $ref: "#/components/schemas/SubscriptionDuration"
        endDate:
          $ref: "#/components/schemas/ISODate"
        nextChargeDate:
          $ref: "#/components/schemas/ISODate"
        autoRenew:
          type: boolean
          default: true
        reminderDaysBefore:
          type: integer
          minimum: 0
          maximum: 365
          default: 3
        status:
          enum: [trial, active, paused]
          default: active
        note:
          type: string
    UpdateSubscriptionRequest:
      type: object
      minProperties: 1
      description: >-
        Nullable duration and endDate form one schedule replacement group. Two
        non-null values conflict; non-null duration computes endDate from
        startDate; only non-null endDate removes duration; two null values clear
        the finite schedule. The complete patched subscription is rejected
        unless its payment account is non-archived and supports amount.currency.
        When startDate moves beyond an inherited nextChargeDate and the request
        does not explicitly replace nextChargeDate, the server advances the
        inherited date to the new startDate.
      properties:
        displayName:
          type: string
        provider:
          type: string
        planName:
          type: [string, "null"]
        amount:
          $ref: "#/components/schemas/Money"
        paymentAccountId:
          $ref: "#/components/schemas/ID"
        billingCycle:
          $ref: "#/components/schemas/SubscriptionBillingCycle"
        startDate:
          $ref: "#/components/schemas/ISODate"
        duration:
          anyOf:
            - $ref: "#/components/schemas/SubscriptionDuration"
            - type: "null"
        endDate:
          anyOf:
            - $ref: "#/components/schemas/ISODate"
            - type: "null"
        nextChargeDate:
          $ref: "#/components/schemas/ISODate"
        autoRenew:
          type: boolean
        reminderDaysBefore:
          type: integer
          minimum: 0
          maximum: 365
        status:
          enum: [trial, active, paused]
        note:
          type: [string, "null"]
    SubscriptionResponse:
