              properties:
                reason:
                  enum: [baseline, manual_refresh]
      responses:
        "200":
          description: Snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorthSnapshotResponse"

  /snapshots/invalidate:
    post:
      tags: [Snapshots]
      summary: Invalidate snapshots after ledger changes.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "204":
          description: Invalidated.

  /categories:
    get:
      tags: [Taxonomy]
      summary: List categories.
      responses:
        "200":
          description: Categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
    post:
      tags: [Taxonomy]
      summary: Create category.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryInput"
      responses:
        "201":
          description: Category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"

  /categories/{categoryId}:
    get:
      tags: [Taxonomy]
      summary: Get category.
      parameters:
        - $ref: "#/components/parameters/categoryId"
      responses:
        "200":
          description: Category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
    patch:
      tags: [Taxonomy]
      summary: Update category.
      parameters:
        - $ref: "#/components/parameters/categoryId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"

  /counterparties:
    get:
      tags: [Taxonomy]
      summary: List counterparties.
      responses:
        "200":
          description: Counterparties.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterpartyListResponse"
    post:
      tags: [Taxonomy]
      summary: Create counterparty.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCounterpartyInput"
      responses:
        "201":
          description: Counterparty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterpartyResponse"

  /counterparties/{counterpartyId}:
    get:
      tags: [Taxonomy]
      summary: Get counterparty.
      parameters:
        - $ref: "#/components/parameters/counterpartyId"
      responses:
        "200":
          description: Counterparty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterpartyResponse"
    patch:
      tags: [Taxonomy]
      summary: Update counterparty.
      parameters:
        - $ref: "#/components/parameters/counterpartyId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Counterparty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterpartyResponse"

  /counterparties/merge-proposal:
    post:
      tags: [Taxonomy]
      summary: Create counterparty merge proposal; never auto-merges.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceCounterpartyIds, targetDisplayName]
              properties:
                sourceCounterpartyIds:
                  type: array
                  items:
                    $ref: "#/components/schemas/ID"
                targetDisplayName:
                  type: string
      responses:
        "200":
          description: Merge proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAtomicGroupResponse"

  /sync/bootstrap:
    get:
      tags: [Sync]
      summary: Bootstrap sync cursor and ledger state.
      responses:
        "200":
          description: Sync bootstrap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncBootstrapResponse"

  /sync/changes:
    get:
      tags: [Sync]
      summary: Pull changes since cursor.
      parameters:
        - name: since
          in: query
          description: >-
            Pull changes after this cursor. local_cursor_0000 is the genesis
            cursor and returns the full retained log; any other unknown cursor
            is rejected instead of silently replaying from the beginning.
          schema:
            type: string
      responses:
        "200":
          description: Changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponseEnvelope"
        "400":
          description: The since cursor is unknown or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /sync/push:
    post:
      tags: [Sync]
      summary: Apply authenticated-device account creates from a remote ledger.
      description: >-
        The bearer token determines the source device. The body deviceId and
        every change deviceId must match it. This first inbound slice accepts
        only entityType=account, operation=create, baseVersion=0, with a full
        Account payload whose id equals entityId. Applied remote changes are
        logged atomically with the account but never enter the server outbox.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Push result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResultResponse"

  /sync/ack:
    post:
      tags: [Sync]
      summary: Acknowledge received sync cursor.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cursor:
                  type: string
                  description: >-
                    Local outbox high-water cursor. local_cursor_0000 is the
                    genesis cursor and acknowledges no changes.
                changeIds:
                  type: array
                  items:
                    type: string
                ackedChangeIds:
                  type: array
                  items:
                    type: string
      responses:
        "204":
          description: Acknowledged.
        "400":
          description: The cursor or change ID is unknown or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Opaque retry key for ledger writes. Reuse the same key only for the
        same operation and JSON request. A persisted replay returns the
        original status/body and Idempotency-Replayed: true; reuse with a
        different request returns 409 idempotency_key_reused.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[!-~]+$"
    accountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    movementId:
      name: movementId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    atomicGroupId:
      name: atomicGroupId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    planId:
      name: planId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    reminderId:
      name: reminderId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    proposalId:
      name: proposalId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    instrumentId:
      name: instrumentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    holdingId:
      name: holdingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    categoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    counterpartyId:
      name: counterpartyId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    deviceId:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"

  schemas:
    ID:
      type: string
    ISODate:
      type: string
      format: date
    ISODateTime:
      type: string
      format: date-time
    DecimalString:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]{1,8})?$"
    CurrencyCode:
      type: string
      minLength: 2
      maxLength: 12

    AppError:
      type: object
      required: [code, message, severity, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        severity:
          enum: [info, warning, error, critical]
        retryable:
          type: boolean
        details: {}

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          $ref: "#/components/schemas/DecimalString"
        currency:
          $ref: "#/components/schemas/CurrencyCode"

    ValueQuality:
      enum: [exact, estimated, incomplete, unpriceable, anomaly]
    QuoteStatus:
      enum: [fresh, stale, offline_cached, incomplete, unpriceable, error]
    MovementStatus:
      enum: [draft, pending_review, confirmed, in_transit, cancelled, reversed]
    AccountType:
      enum:
        - bank
        - brokerage
        - exchange
        - wallet
        - platform_wallet
        - virtual_card
        - social_security
        - credit_card
        - loan
        - cash
        - other

    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/OkEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [status, serverTime, version]
              properties:
                status:
                  enum: [ok]
                serverTime:
                  $ref: "#/components/schemas/ISODateTime"
                version:
                  type: string

    OkEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data: {}
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok:
          const: false
        error:
          $ref: "#/components/schemas/AppError"

    LoginRequest:
      type: object
      required: [username, password, deviceName]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        deviceName:
          type: string

    AuthTokenResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [accessToken, refreshToken, expiresAt, refreshExpiresAt, deviceId]
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresAt:
              $ref: "#/components/schemas/ISODateTime"
            refreshExpiresAt:
              $ref: "#/components/schemas/ISODateTime"
            deviceId:
              $ref: "#/components/schemas/ID"

    Device:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        createdAt:
          $ref: "#/components/schemas/ISODateTime"
        lastSeenAt:
          $ref: "#/components/schemas/ISODateTime"
    DeviceListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    AccountCashBalance:
      type: object
      required: [currency, amount, asOf, quality]
      properties:
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        amount:
          $ref: "#/components/schemas/DecimalString"
        asOf:
          $ref: "#/components/schemas/ISODateTime"
        quality:
          $ref: "#/components/schemas/ValueQuality"
    Account:
      type: object
      required:
        - id
        - displayName
        - accountType
        - defaultCurrency
        - supportedCurrencies
        - includeInNetWorth
        - visibility
        - status
        - balanceMode
        - cashBalances
        - tags
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/ID"
        displayName:
          type: string
        institutionName:
          type: string
        accountType:
          $ref: "#/components/schemas/AccountType"
        defaultCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        supportedCurrencies:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyCode"
        includeInNetWorth:
          type: boolean
        visibility:
          enum: [normal, hidden_amount, archived]
        status:
          enum: [active, inactive, archived]
        balanceMode:
          enum: [cash_balance, holdings, liability, mixed]
        cashBalances:
          type: array
          items:
            $ref: "#/components/schemas/AccountCashBalance"
        tags:
          type: array
          items:
            type: string
        note:
          type: string
        liabilityTerms:
          $ref: "#/components/schemas/LiabilityTerms"
        createdAt:
          $ref: "#/components/schemas/ISODateTime"
        updatedAt:
          $ref: "#/components/schemas/ISODateTime"
    CreateAccountInput:
      type: object
      required:
        - displayName
        - accountType
        - defaultCurrency
        - supportedCurrencies
        - includeInNetWorth
        - balanceMode
      properties:
        displayName:
          type: string
        institutionName:
          type: string
        accountType:
          $ref: "#/components/schemas/AccountType"
        defaultCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        supportedCurrencies:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyCode"
        includeInNetWorth:
          type: boolean
        balanceMode:
          enum: [cash_balance, holdings, liability, mixed]
        openingBalances:
          type: array
          items:
            $ref: "#/components/schemas/AccountCashBalance"
    AccountResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: "#/components/schemas/Account"
    AccountListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    AccountAnomaly:
      type: object
      required: [id, accountId, kind, severity, detail, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        accountId:
          $ref: "#/components/schemas/ID"
        kind:
          enum: [quote_stale, unpriceable, reconcile_needed, negative_balance, data_anomaly]
        severity:
          enum: [info, warning, critical]
        detail:
          type: string
        affectedValue:
          $ref: "#/components/schemas/Money"
        action:
          enum: [review, refresh, reconcile, ignore]
        createdAt:
          $ref: "#/components/schemas/ISODateTime"
    AccountAnomalyListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/AccountAnomaly"

    Instrument:
      type: object
      required: [id, type, displayName, quoteCurrency]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        type:
          enum: [cash, equity, fund, crypto, fx_cash, receivable, other]
        symbol:
          type: string
        displayName:
          type: string
        quoteCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        market:
          type: string
        sourceRef:
          type: string
    InstrumentResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: "#/components/schemas/Instrument"
    InstrumentListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Instrument"
    CreateInstrumentRequest:
      type: object
      required: [type, displayName, quoteCurrency]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        type:
          enum: [cash, equity, fund, crypto, fx_cash, receivable, other]
        symbol:
          type: string
        displayName:
          type: string
        quoteCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        market:
          type: string
        sourceRef:
          type: string
    UpdateInstrumentRequest:
      type: object
      properties:
        type:
          enum: [cash, equity, fund, crypto, fx_cash, receivable, other]
        symbol:
          type: string
          nullable: true
        displayName:
          type: string
        quoteCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        market:
          type: string
          nullable: true
        sourceRef:
          type: string
          nullable: true
    ValuedMoney:
      type: object
      required: [amount, currency, asOf, quality]
      properties:
        amount:
          $ref: "#/components/schemas/DecimalString"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        asOf:
          $ref: "#/components/schemas/ISODateTime"
        quality:
          $ref: "#/components/schemas/ValueQuality"
    Holding:
      type: object
      required: [id, accountId, instrumentId, quantity, quoteStatus, asOf]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        accountId:
          $ref: "#/components/schemas/ID"
        instrumentId:
