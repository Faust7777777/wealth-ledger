openapi: 3.1.0
info:
  title: Finwealth API
  version: 0.1.0
  description: >
    Draft HTTP API for the personal asset / investment / liability control
    panel. This API never executes transfers, places orders, or lets AI write
    directly to the confirmed ledger.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Ledger
  - name: Accounts
  - name: Portfolio
  - name: Movements
  - name: DCA
  - name: Subscriptions
  - name: AI Proposals
  - name: Quotes
  - name: Instruments
  - name: Snapshots
  - name: Taxonomy
  - name: Sync

paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Check service health.
      responses:
        "200":
          description: Service status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login with username, password, and device name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens for this device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Refreshed tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"

  /auth/logout:
    post:
      tags: [Auth]
      security:
        - {}
        - bearerAuth: []
      summary: Revoke a refresh token from the optional body, or the bearer access token.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "204":
          description: Logged out.

  /auth/devices:
    get:
      tags: [Auth]
      summary: List authorized devices.
      responses:
        "200":
          description: Authorized devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"

  /auth/devices/{deviceId}/revoke:
    post:
      tags: [Auth]
      summary: Revoke a device.
      parameters:
        - $ref: "#/components/parameters/deviceId"
      responses:
        "204":
          description: Device revoked.

  /ledger/bootstrap:
    get:
      tags: [Ledger]
      summary: Bootstrap ledger data for a device.
      responses:
        "200":
          description: Bootstrap payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerBootstrapResponse"

  /accounts:
    get:
      tags: [Accounts]
      summary: List accounts.
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
    post:
      tags: [Accounts]
      summary: Create account.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountInput"
      responses:
        "201":
          description: Created account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"

  /accounts/anomalies:
    get:
      tags: [Accounts]
      summary: List account anomalies.
      responses:
        "200":
          description: Account anomalies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAnomalyListResponse"

  /accounts/{accountId}:
    get:
      tags: [Accounts]
      summary: Get account.
      parameters:
        - $ref: "#/components/parameters/accountId"
      responses:
        "200":
          description: Account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
    patch:
      tags: [Accounts]
      summary: Update account.
      parameters:
        - $ref: "#/components/parameters/accountId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"

  /accounts/{accountId}/archive:
    post:
      tags: [Accounts]
      summary: Archive account without deleting ledger history.
      parameters:
        - $ref: "#/components/parameters/accountId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: Archived account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"

  /accounts/{accountId}/holdings:
    get:
      tags: [Portfolio]
      summary: List holdings by account.
      parameters:
        - $ref: "#/components/parameters/accountId"
      responses:
        "200":
          description: Holdings in the account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingListResponse"

  /accounts/{accountId}/holding-adjustment-proposals:
    post:
      tags: [Portfolio]
      summary: Propose importing or correcting one current holding quantity.
      parameters:
        - $ref: "#/components/parameters/accountId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingAdjustmentInput"
      responses:
        "200":
          description: Pending holding-adjustment atomic group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAtomicGroupResponse"

  /portfolio/overview:
    get:
      tags: [Portfolio]
      summary: Get overview for the first screen.
      responses:
        "200":
          description: Portfolio overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioOverviewResponse"

  /portfolio/valuation-issues:
    get:
      tags: [Portfolio]
      summary: List assets whose value is stale, cached, failed, or unavailable.
      responses:
        "200":
          description: Structured valuation issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValuationIssueListResponse"

  /portfolio/holdings:
    get:
      tags: [Portfolio]
      summary: List holdings across accounts.
      responses:
        "200":
          description: Holdings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingListResponse"

  /holdings:
    get:
      tags: [Portfolio]
      summary: Alias for /portfolio/holdings used by the local server frontend adapter.
      responses:
        "200":
          description: Holdings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingListResponse"

  /yield-positions:
    get:
      tags: [Portfolio]
      summary: List fixed-yield positions with accrued interest.
      parameters:
        - in: query
          name: throughDate
          schema:
            $ref: "#/components/schemas/ISODate"
      responses:
        "200":
          description: Yield positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YieldPositionListResponse"

  /holdings/{holdingId}/yield-terms:
    patch:
      tags: [Portfolio]
      summary: Configure interest terms for one concrete holding.
      parameters:
        - $ref: "#/components/parameters/holdingId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YieldTermsInput"
      responses:
        "200":
          description: Holding with updated yield terms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingResponse"

  /holdings/{holdingId}/interest-proposals:
    post:
      tags: [Portfolio]
      summary: Propose accrued interest through a date for review.
      parameters:
        - $ref: "#/components/parameters/holdingId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterestProposalInput"
      responses:
        "200":
          description: Pending interest atomic group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAtomicGroupResponse"

  /liability-positions:
    get:
      tags: [Accounts]
      summary: List loan positions with accrued interest and the next scheduled payment split.
      parameters:
        - in: query
          name: throughDate
          schema:
            $ref: "#/components/schemas/ISODate"
      responses:
        "200":
          description: Liability positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiabilityPositionListResponse"

  /accounts/{accountId}/liability-terms:
    patch:
      tags: [Accounts]
      summary: Configure interest and scheduled-payment terms for a liability account.
      parameters:
        - $ref: "#/components/parameters/accountId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiabilityTermsInput"
      responses:
        "200":
          description: Account with updated liability terms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"

  /accounts/{accountId}/repayment-schedule:
    get:
      tags: [Accounts]
      summary: Project a bounded monthly repayment schedule from current liability terms.
      parameters:
        - $ref: "#/components/parameters/accountId"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 360
            default: 24
      responses:
        "200":
          description: Projected repayment schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanRepaymentScheduleResponse"

  /accounts/{accountId}/loan-interest-proposals:
    post:
      tags: [Accounts]
      summary: Propose accrued loan interest through a date for review.
      parameters:
        - $ref: "#/components/parameters/accountId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterestProposalInput"
      responses:
        "200":
          description: Pending loan-interest atomic group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAtomicGroupResponse"

  /accounts/{accountId}/loan-payment-proposals:
    post:
      tags: [Accounts]
      summary: Propose accrued interest and a loan payment as one reviewed atomic group.
      parameters:
        - $ref: "#/components/parameters/accountId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanPaymentProposalInput"
      responses:
        "200":
          description: Pending loan-payment atomic group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAtomicGroupResponse"

  /portfolio/allocation:
    get:
      tags: [Portfolio]
      summary: Get asset allocation.
      responses:
        "200":
          description: Asset allocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetAllocationResponse"

  /movements:
    get:
      tags: [Movements]
      summary: List movements.
      parameters:
        - name: limit
          in: query
          description: Optional maximum result count; base list preserves ledger order.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: status
          in: query
          description: Optional exact MovementStatus filter applied before limit.
          schema:
            $ref: "#/components/schemas/MovementStatus"
      responses:
        "200":
          description: Movements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementListResponse"

  /movements/recent:
    get:
      tags: [Movements]
      summary: Alias for /movements with recent-first ordering.
      parameters:
        - name: limit
          in: query
          description: Maximum recent-first result count; defaults to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Recent movements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementListResponse"

  /movements/drafts:
    post:
      tags: [Movements]
      summary: Create a manual draft; does not affect confirmed net worth.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMovementDraftInput"
      responses:
        "201":
          description: Draft movement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResponse"

  /movements/{movementId}:
    get:
      tags: [Movements]
      summary: Get movement.
      parameters:
        - $ref: "#/components/parameters/movementId"
      responses:
        "200":
          description: Movement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResponse"

  /movements/{movementId}/submit-review:
    post:
      tags: [Movements]
      summary: Submit a draft movement for review.
      parameters:
        - $ref: "#/components/parameters/movementId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: Atomic group proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAtomicGroupResponse"

  /movements/corrections:
    post:
      tags: [Movements]
      summary: Create a correction proposal for confirmed ledger data.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCorrectionInput"
      responses:
        "200":
          description: Correction atomic group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAtomicGroupResponse"
        "400":
          description: Invalid or no-op correction input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The target already has a pending correction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /atomic-groups/{atomicGroupId}/confirm:
    post:
      tags: [Movements]
      summary: Confirm an atomic group as one transaction boundary.
      parameters:
        - $ref: "#/components/parameters/atomicGroupId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: Confirm result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmResultResponse"

  /atomic-groups/{atomicGroupId}/reject:
    post:
      tags: [Movements]
      summary: Reject an atomic group.
      parameters:
        - $ref: "#/components/parameters/atomicGroupId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "204":
          description: Rejected.

  /dca/plans:
    get:
      tags: [DCA]
      summary: List DCA plans.
      responses:
        "200":
          description: DCA plans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcaPlanListResponse"
    post:
      tags: [DCA]
      summary: Create DCA plan.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDcaPlanInput"
      responses:
        "201":
          description: DCA plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcaPlanResponse"

  /dca/plans/{planId}:
    patch:
      tags: [DCA]
      summary: Update DCA plan.
      parameters:
        - $ref: "#/components/parameters/planId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: DCA plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcaPlanResponse"

  /dca/reminders/due:
    get:
      tags: [DCA]
      summary: List due DCA reminders.
      responses:
        "200":
          description: Due reminders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcaReminderListResponse"

  /dca/reminders/{reminderId}/mark-executed-as-proposal:
    post:
      tags: [DCA]
      summary: Create a proposal that records the user-executed DCA; never places an order.
      parameters:
        - $ref: "#/components/parameters/reminderId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DcaExecutionInput"
      responses:
        "200":
          description: Candidate atomic group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAtomicGroupResponse"

  /dca/reminders/{reminderId}/skip:
    post:
      tags: [DCA]
      summary: Skip this DCA reminder.
      parameters:
        - $ref: "#/components/parameters/reminderId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: Updated reminder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcaReminderResponse"

  /dca/reminders/{reminderId}/snooze:
    post:
      tags: [DCA]
      summary: Snooze this DCA reminder.
      parameters:
        - $ref: "#/components/parameters/reminderId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until:
                  $ref: "#/components/schemas/ISODateTime"
      responses:
        "200":
          description: Updated reminder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcaReminderResponse"

  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: List account subscriptions ordered by next charge date.
      responses:
        "200":
          description: Subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionListResponse"
    post:
      tags: [Subscriptions]
      summary: Create a recurring subscription plan; does not write an expense.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"

  /subscriptions/upcoming:
    get:
      tags: [Subscriptions]
      summary: List active or trial subscriptions due within a future window.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: Upcoming subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionListResponse"

  /subscriptions/charge-proposals/due-scan:
    post:
      tags: [Subscriptions]
      summary: Generate bounded pending charge proposals for subscriptions due through a date.
      description: >-
        Scans trial and active subscriptions in stable nextChargeDate/id order.
        The limit bounds newly created proposals, while already-pending and
        payment-blocked items are reported as skips. No balance is changed and
        no schedule is advanced until each returned atomic group is confirmed.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionDueScanRequest"
      responses:
        "200":
          description: Due scan completed and its pending candidates were persisted atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDueScanResponse"
        "400":
          description: Invalid throughDate, limit, or unsupported request field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The Idempotency-Key was reused with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "501":
          description: No real local ledger is mounted for this command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /subscriptions/{subscriptionId}:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ID"
    get:
      tags: [Subscriptions]
      summary: Get one subscription.
      responses:
        "200":
          description: Subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
    patch:
      tags: [Subscriptions]
      summary: Update subscription schedule or metadata.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionRequest"
      responses:
        "200":
          description: Updated subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"

  /subscriptions/{subscriptionId}/cancel:
    post:
      tags: [Subscriptions]
      summary: Cancel future renewal without deleting historical charges.
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ID"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: Cancelled subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"

  /subscriptions/{subscriptionId}/charge-proposal:
    post:
      tags: [Subscriptions]
      summary: Generate one pending expense proposal for the next scheduled charge.
      description: The confirmed ledger changes only after the atomic group is confirmed.
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ID"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "201":
          description: Pending subscription charge proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAtomicGroupResponse"

  /ai/proposals/from-text:
    post:
      tags: [AI Proposals]
      summary: Create AI proposal from text.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTextInput"
      responses:
        "200":
          description: AI proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProposalResponse"

  /ai/proposals/from-image:
    post:
      tags: [AI Proposals]
      summary: Create AI proposal from image evidence.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiImageInput"
      responses:
        "200":
          description: AI proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProposalResponse"

  /ai/proposals/from-csv:
    post:
      tags: [AI Proposals]
      summary: Create AI proposal from CSV import.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCsvInput"
      responses:
        "200":
          description: AI proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProposalResponse"

  /ai/proposals/pending:
    get:
      tags: [AI Proposals]
      summary: List pending AI proposals.
      responses:
        "200":
          description: Pending proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProposalListResponse"

  /ai/proposals/{proposalId}:
    get:
      tags: [AI Proposals]
      summary: Get AI proposal.
      parameters:
        - $ref: "#/components/parameters/proposalId"
      responses:
        "200":
          description: AI proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProposalResponse"

  /ai/atomic-groups/{atomicGroupId}/approve:
    post:
      tags: [AI Proposals]
      summary: Approve atomic group after validation.
      parameters:
        - $ref: "#/components/parameters/atomicGroupId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: Confirm result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmResultResponse"

  /ai/atomic-groups/{atomicGroupId}/reject:
    post:
      tags: [AI Proposals]
      summary: Reject AI atomic group.
      parameters:
        - $ref: "#/components/parameters/atomicGroupId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "204":
          description: Rejected.

  /ai/atomic-groups/{atomicGroupId}/edit:
    post:
      tags: [AI Proposals]
      summary: Edit atomic group and re-run validation.
      parameters:
        - $ref: "#/components/parameters/atomicGroupId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Edited atomic group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAtomicGroupResponse"

  /quotes/summary:
    get:
      tags: [Quotes]
      summary: Get quote status summary.
      responses:
        "200":
          description: Quote status summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteStatusSummaryResponse"

  /quotes:
    get:
      tags: [Quotes]
      summary: List quotes.
      responses:
        "200":
          description: Quotes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteListResponse"

  /fx-rates:
    get:
      tags: [Quotes]
      summary: List FX rates.
      responses:
        "200":
          description: FX rates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FXRateListResponse"

  /quotes/refresh:
    post:
      tags: [Quotes]
      summary: Refresh quotes and FX rates.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRefreshRequest"
      responses:
        "200":
          description: Refresh result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRefreshResultResponse"

  /instruments:
    get:
      tags: [Instruments]
      summary: List instruments.
      responses:
        "200":
          description: Instruments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentListResponse"
    post:
      tags: [Instruments]
      summary: Create an instrument.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstrumentRequest"
      responses:
        "201":
          description: Created instrument.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentResponse"

  /instruments/{instrumentId}:
    get:
      tags: [Instruments]
      summary: Get an instrument.
      parameters:
        - $ref: "#/components/parameters/instrumentId"
      responses:
        "200":
          description: Instrument.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentResponse"
    patch:
