    Counterparty:
      type: object
      required: [id, displayName, aliases, isUserMerged]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        displayName:
          type: string
        aliases:
          type: array
          items:
            type: string
        normalizedName:
          type: string
        categoryHintId:
          $ref: "#/components/schemas/ID"
        isUserMerged:
          type: boolean
    CreateCounterpartyInput:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        aliases:
          type: array
          items:
            type: string
          default: []
        normalizedName:
          type: string
        categoryHintId:
          $ref: "#/components/schemas/ID"
    CategoryResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: "#/components/schemas/Category"
    CategoryListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    CounterpartyResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: "#/components/schemas/Counterparty"
    CounterpartyListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Counterparty"

    LedgerBootstrapResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [ledgerVersion, syncCursor, baseCurrency, accounts, categories, counterparties, subscriptions, capabilities]
          properties:
            ledgerVersion:
              type: integer
            syncCursor:
              type: string
            baseCurrency:
              $ref: "#/components/schemas/CurrencyCode"
            snapshot:
              $ref: "#/components/schemas/NetWorthSnapshot"
            accounts:
              type: array
              items:
                $ref: "#/components/schemas/Account"
            categories:
              type: array
              items:
                $ref: "#/components/schemas/Category"
            counterparties:
              type: array
              items:
                $ref: "#/components/schemas/Counterparty"
            subscriptions:
              type: array
              items:
                $ref: "#/components/schemas/Subscription"
            capabilities:
              $ref: "#/components/schemas/LedgerCapabilities"

    LedgerCapabilities:
      type: object
      required:
        - dataSourceMode
        - canWriteConfirmedLedger
        - canCreateAccount
        - canRecordMovement
        - canManageSubscriptions
        - canConfirmProposal
        - canPersistPendingProposal
        - proposalPersistence
        - canRefreshQuotes
        - canUseOutboundQuoteProvider
        - canSync
        - canUseRealAiProvider
      properties:
        dataSourceMode:
          enum: [real_local, dev_empty, dev_scenario, debug_fixture, local_server]
        canWriteConfirmedLedger:
          type: boolean
          description: True only when confirmed/effective ledger writes are available.
        canCreateAccount:
          type: boolean
        canRecordMovement:
          type: boolean
        canManageSubscriptions:
          type: boolean
        canConfirmProposal:
          type: boolean
        canPersistPendingProposal:
          type: boolean
        proposalPersistence:
          enum: [none, memory, file]
        canRefreshQuotes:
          type: boolean
        canUseOutboundQuoteProvider:
          type: boolean
          description: True only after explicit quote-provider opt-in.
        canSync:
          type: boolean
        canUseRealAiProvider:
          type: boolean

    SyncStatus:
      enum: [synced, syncing, offline, degraded, conflict, error]
    SyncChange:
      type: object
      required: [id, deviceId, entityType, entityId, operation, payload, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        deviceId:
          $ref: "#/components/schemas/ID"
        entityType:
          enum:
            - account
            - instrument
            - holding
            - movement
            - dca_plan
            - subscription
            - category
            - counterparty
            - quote
            - fx_rate
            - snapshot
            - ai_proposal
        entityId:
          $ref: "#/components/schemas/ID"
        operation:
          enum: [create, update, delete, correction]
        payload: {}
        baseVersion:
          type: integer
        createdAt:
          $ref: "#/components/schemas/ISODateTime"
    SyncConflict:
      type: object
      required: [id, entityType, entityId, localChange, remoteChange, resolution]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        kind:
          enum: [entity_already_exists]
        entityType:
          type: string
        entityId:
          $ref: "#/components/schemas/ID"
        localChange:
          $ref: "#/components/schemas/SyncChange"
        remoteChange:
          $ref: "#/components/schemas/SyncChange"
        resolution:
          enum: [pending, local_wins, remote_wins, manual]
    SyncBootstrapResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [cursor]
          properties:
            cursor:
              type: string
              description: local_cursor_0000 for an empty retained sync log.
    SyncPullResponseEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [cursor, changes, conflicts]
          properties:
            cursor:
              type: string
              description: Cursor from the same ledger snapshot as changes.
            changes:
              type: array
              items:
                $ref: "#/components/schemas/SyncChange"
            conflicts:
              type: array
              items:
                $ref: "#/components/schemas/SyncConflict"
    SyncPushRequest:
      type: object
      required: [deviceId, changes]
      properties:
        deviceId:
          $ref: "#/components/schemas/ID"
          description: Must equal the device identity resolved from the bearer token.
        lastKnownCursor:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/InboundAccountCreateSyncChange"
    InboundAccountCreateSyncChange:
      type: object
      required:
        [id, deviceId, entityType, entityId, operation, payload, baseVersion, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        deviceId:
          $ref: "#/components/schemas/ID"
          description: Must equal the authenticated request device.
        entityType:
          const: account
        entityId:
          $ref: "#/components/schemas/ID"
        operation:
          const: create
        payload:
          allOf:
            - $ref: "#/components/schemas/Account"
          description: payload.id must equal entityId.
        baseVersion:
          const: 0
        createdAt:
          $ref: "#/components/schemas/ISODateTime"
    SyncPushResultResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required:
            [cursor, acceptedChangeIds, appliedChangeIds, skippedChangeIds, conflicts]
          properties:
            cursor:
              type: string
            acceptedChangeIds:
              type: array
              description: Remote IDs whose entity and relay log were persisted.
              items:
                type: string
            appliedChangeIds:
              type: array
              description: Remote IDs whose account entities were applied in this request.
              items:
                type: string
            skippedChangeIds:
              type: array
              description: Idempotent replays already identified by source device and ID.
              items:
                type: string
            conflicts:
              type: array
              items:
                $ref: "#/components/schemas/SyncConflict"
